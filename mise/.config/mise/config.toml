[tools]
node = "24.18.0"
"npm:typescript" = "latest"
"npm:typescript-language-server" = "latest"
"npm:pnpm" = "latest"
"npm:opencode-ai" = { version = "latest", allow_builds = ["opencode-ai"] }
bun = "latest"
elixir = "1.20.4-otp-29"
erlang = "29.0.6"
lua-language-server = "latest"
