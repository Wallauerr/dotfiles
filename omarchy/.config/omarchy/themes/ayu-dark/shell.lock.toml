[general]
disable_loading_bar = true
hide_cursor = true
grace = 0

[background]
path = "screenshot"
blur_passes = 2
blur_size = 7
noise = 0.0117
contrast = 0.8916
brightness = 0.8172
vibrancy = 0.1696
vibrancy_darkness = 0.0

[input-field]
size = { width = 320, height = 52 }
outline_thickness = 2
dots_size = 0.2
dots_spacing = 0.25
dots_center = true
outer_color = "rgba(90, 99, 120, 0.4)"
inner_color = "rgba(13, 16, 23, 0.85)"
font_color = "rgb(191, 189, 182)"
fade_on_empty = true
placeholder_text = '<span foreground="#5a6378">Password</span>'
hide_input = false
check_color = "rgb(230, 180, 80)"
fail_color = "rgb(217, 87, 87)"
capslock_color = "rgb(255, 143, 64)"
invert_numlock = true

[date]
font_size = 24
font_family = "Inter, sans-serif"
color = "rgb(191, 189, 182)"
position = { x = 0, y = -110 }
halign = "center"
valign = "top"

[time]
font_size = 72
font_family = "Inter, sans-serif"
color = "rgb(191, 189, 182)"
position = { x = 0, y = -170 }
halign = "center"
valign = "top"

[label]
text = ""
color = "rgb(191, 189, 182)"
font_size = 14
font_family = "Inter, sans-serif"
position = { x = 0, y = 90 }
halign = "center"
valign = "center"
